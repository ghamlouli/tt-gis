<div class="page">
  <h1 class="page-title">GIS Cloud — Visualisation</h1>

  <div class="toolbar">
    <div class="filters">
      <app-geo-select [allowAll]="true" (gouvernoratChange)="onGouvChange($event)" (delegationChange)="onDelegationChange($event)"></app-geo-select>

      <div class="field">
        <label>Accès</label>
        <select [(ngModel)]="accesFiltre">
          <option value="">Tous les accès</option>
          <option *ngFor="let a of accesTypes" [value]="a.value">{{ a.label }}</option>
        </select>
      </div>
    </div>

    <button type="button" class="primary-btn" (click)="generer()" [disabled]="loading()">
      {{ loading() ? 'Génération...' : 'Générer' }}
    </button>
  </div>

  <div class="table-wrapper" *ngIf="generated()">
    <table>
      <thead>
        <tr>
          <th>Symbole</th><th>Accès</th><th>X</th><th>Y</th>
          <th>Ports libres</th><th>Technologies</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows()">
          <td><app-acces-symbol [acces]="r.acces"></app-acces-symbol></td>
          <td>{{ r.nom }}</td>
          <td>{{ r.coordX }}</td>
          <td>{{ r.coordY }}</td>
          <td>{{ r.portsLibres ?? '-' }}</td>
          <td>{{ r.technologies.length ? r.technologies.join(', ') : '-' }}</td>
          <td class="actions">
            <button class="action-btn edit-btn" (click)="onEdit(r)" title="Modifier">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 0 3L12 12l-4 1 1-4 6.5-6.5a2.121 2.121 0 0 1 3 0Z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" (click)="onDelete(r)" title="Supprimer">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="rows().length === 0">
          <td colspan="7" class="empty">Aucune donnée pour ces filtres.</td>
        </tr>
      </tbody>
    </table>

    <!-- Un seul bouton, sous le tableau, pour visualiser EXACTEMENT
         les lignes ci-dessus sur la carte -->
    <div class="map-toggle-bar" *ngIf="rows().length > 0">
      <button type="button" class="secondary-btn-active" (click)="toggleMap()">
        {{ showMap() ? 'Masquer la carte' : 'Visualiser (' + rows().length + ' équipements)' }}
      </button>
    </div>
  </div>

  <app-gis-map *ngIf="generated() && showMap() && rows().length > 0" [rows]="rows()"></app-gis-map>
</div>
