<div class="auth-page">
  <div class="auth-background"></div>
  <div class="auth-card">
    <div class="logo-section">
      <img src="/assets/tt-logo.png" alt="Tunisie Telecom" class="auth-logo">
      <div class="logo-glow"></div>
    </div>

    <h1 class="auth-title">Bienvenue sur <span class="highlight">Tunisie Telecom</span></h1>
    <p class="auth-subtitle">Sélectionnez votre espace pour continuer</p>

    <div class="space-selection">
      <button class="space-btn tt-btn" (click)="goToTtSpace()">
        <div class="btn-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 21h18M5 21V7l8-4 8 4v14M8 21v-9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v9"/>
          </svg>
        </div>
        <div class="btn-content">
          <div class="btn-label">Espace Employé</div>
          <div class="btn-desc">Accès réservé au personnel TT</div>
        </div>
        <div class="btn-arrow">→</div>
      </button>

      <button class="space-btn visitor-btn" (click)="goToVisitorSpace()">
        <div class="btn-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="7" r="4"/>
            <path d="M5.5 21v-2a4.5 4.5 0 0 1 4.5-4.5h4a4.5 4.5 0 0 1 4.5 4.5v2"/>
          </svg>
        </div>
        <div class="btn-content">
          <div class="btn-label">Espace Visiteur</div>
          <div class="btn-desc">Découvrez nos services</div>
        </div>
        <div class="btn-arrow">→</div>
      </button>
    </div>

    <div class="auth-footer">
      <p>© 2024 Tunisie Telecom - Tous droits réservés</p>
    </div>
  </div>
</div>
