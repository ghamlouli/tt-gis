<div class="auth-page">
  <div class="auth-card">
    <img src="/assets/tt-logo.png" alt="Tunisie Telecom" class="auth-logo">

    <h1 class="auth-title">Récupération du mot de passe</h1>

    <form class="auth-form" (ngSubmit)="submit()">
      <label for="matricule">Matricule</label>
      <input id="matricule" type="text" name="matricule" placeholder="Matricule" [(ngModel)]="matricule" disabled>

      <label for="login">Login</label>
      <input id="login" type="text" name="login" placeholder="Login" [(ngModel)]="login" disabled>

      <label for="nom">Nom</label>
      <input id="nom" type="text" name="nom" placeholder="Nom" [(ngModel)]="nom" disabled>

      <label for="prenom">Prénom</label>
      <input id="prenom" type="text" name="prenom" placeholder="Prénom" [(ngModel)]="prenom" disabled>

      <label for="profil">Profil</label>
      <select id="profil" name="profil" [(ngModel)]="profil" disabled>
        <option value="" disabled>Sélectionner un profil</option>
        <option *ngFor="let p of profils" [value]="p">{{ p }}</option>
      </select>

      <label for="motDePasse">Nouveau mot de passe</label>
      <input id="motDePasse" type="password" name="motDePasse" placeholder="Nouveau mot de passe" autocomplete="new-password" [(ngModel)]="motDePasse">

      <label for="confirmMotDePasse">Confirmer le mot de passe</label>
      <input id="confirmMotDePasse" type="password" name="confirmMotDePasse" placeholder="Confirmer le mot de passe" autocomplete="new-password" [(ngModel)]="confirmMotDePasse">

      <p class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button class="primary-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Validation...' : 'Valider' }}
      </button>
    </form>

    <p class="auth-switch">
      <button type="button" class="link-btn" (click)="goToLogin()">Retour à la connexion</button>
    </p>
  </div>
</div>
