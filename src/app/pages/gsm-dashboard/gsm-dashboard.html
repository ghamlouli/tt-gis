<div class="page">
  <h1 class="page-title">Tableau de bord GSM</h1>

  <div class="toolbar">
    <div class="filters">
      <app-geo-select [allowAll]="true" (gouvernoratChange)="onGouvChange($event)" (delegationChange)="onDelegationChange($event)"></app-geo-select>

      <div class="field">
        <label>Fournisseur</label>
        <select [(ngModel)]="fournisseurFiltre" (ngModelChange)="onFournisseurChange()">
          <option value="">Tous les fournisseurs</option>
          <option *ngFor="let f of fournisseurs" [value]="f">{{ f }}</option>
        </select>
      </div>
    </div>

    <div class="export-buttons">
      <button type="button" class="export-btn" (click)="exportPdf()">Exporter PDF</button>
      <button type="button" class="export-btn" (click)="exportExcel()">Exporter Excel</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Code</th><th>Nom</th><th>Gouvernorat</th><th>Délégation</th>
          <th>X</th><th>Y</th><th>Technologies</th><th>Fournisseur</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows()">
          <td>{{ r.code }}</td>
          <td>{{ r.nom }}</td>
          <td>{{ r.gouvernorat }}</td>
          <td>{{ r.delegation }}</td>
          <td>{{ r.coordX }}</td>
          <td>{{ r.coordY }}</td>
          <td>{{ r.technologies.join(', ') }}</td>
          <td>{{ r.fournisseur }}</td>
          <td class="actions">
            <button class="action-btn edit-btn" (click)="onEdit(r)" title="Modifier">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 0 3L12 12l-4 1 1-4 6.5-6.5a2.121 2.121 0 0 1 3 0Z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" (click)="onDelete(r)" title="Supprimer">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="!loading() && rows().length === 0">
          <td colspan="9" class="empty">Aucune donnée pour ces filtres.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
