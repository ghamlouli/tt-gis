<header class="app-header">
  <div class="header-top">
    <div class="brand-block">
      <button class="brand-logo" type="button" (click)="navigateTo('/workspace')">
        <img src="/assets/tt-logo.png" alt="TT Tunisie Telecom" class="logo-img">
      </button>
      <div class="brand-copy">
        <span class="brand-title">TT GIS</span>
        <span class="brand-subtitle">Plateforme réseaux d'accès</span>
      </div>
    </div>

    <div class="header-actions">
      <button
        class="home-btn"
        type="button"
        [class.active]="isHomeActive()"
        (click)="navigateTo('/workspace')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Accueil</span>
      </button>

      <div class="user-section">
        <div class="user-panel">
          <div class="user-avatar">{{ userInitials }}</div>
          <div class="user-meta">
            <span class="user-name">{{ currentUserName }}</span>
            <span class="user-role">{{ currentRole }}</span>
          </div>
        </div>

        <div class="action-divider"></div>

        <div class="admin-actions" *ngIf="isAdmin()">
          <button
            class="admin-action-btn"
            type="button"
            (click)="navigateTo('/admin/create-account')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            <span>Créer compte</span>
          </button>
        </div>

        <div class="action-divider"></div>

        <button class="logout-btn" type="button" (click)="logout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>
  </div>

  <nav class="header-nav" aria-label="Navigation principale">
    <div class="nav-section">
      <span class="nav-section-label">Modules réseau</span>
      <div class="nav-modules">
        <div
          class="nav-module"
          *ngFor="let module of networkModules"
          [class.active]="isModuleActive(module)">
          <button
            class="module-trigger"
            type="button"
            [style.--module-accent]="module.accent"
            (click)="toggleDropdown(module.id, $event)">
            <span class="module-icon">{{ module.shortLabel }}</span>
            <span class="module-label">{{ module.label }}</span>
            <span class="dropdown-arrow" [class.open]="activeMenu === module.id">▾</span>
          </button>

          <div class="dropdown-panel" [class.show]="activeMenu === module.id" (click)="$event.stopPropagation()">
            <div class="dropdown-header" [style.background]="module.accent">
              <strong>{{ module.label }}</strong>
              <span>{{ module.links.length }} entrées</span>
            </div>
            <button
              class="dropdown-link"
              type="button"
              *ngFor="let link of module.links"
              (click)="navigateTo(link.route, $event)">
              <span>{{ link.label }}</span>
              <span class="link-arrow">→</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
